<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analýza soudnictví ČR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="stylesoud.css">
</head>
<body>
    
    <nav class="top-nav">
        <div class="nav-brand">JusticeData</div>
        <div class="nav-links">
            <a href="../veznice/veznice.html">Věznice</a>
            <a href="soudy.html" class="active">Soudy</a>
            <a href="../pcr/pcr.html">Kriminalita</a>
            <a href="../oprojektu/o-projektu.html">O projektu</a>
        </div>
    </nav>

    <div class="content-wrapper">
        <aside id="sidebar">
            <header>
                <h1>Statistiky soudů</h1>
                <p>Interaktivní přehled výkonnosti soudů ČR</p>
            </header>

            <div class="layer-toggle">
                <input type="radio" id="level-ks" name="court-level" value="KS" checked>
                <label for="level-ks">Krajské soudy</label>
                
                <input type="radio" id="level-os" name="court-level" value="OS">
                <label for="level-os">Okresní soudy</label>
            </div>

            <section class="filters">
                <div class="control-group">
                    <label>Agenda</label>
                    <select id="agendaSelect"></select>
                </div>
                <div class="control-group">
                    <label>Referenční rok</label>
                    <select id="yearSelect"></select>
                </div>
            </section>

            <section id="details" class="details-container">
                <div class="empty-state">
                    <p>Vyberte soud v mapě pro zobrazení detailních grafů a dat.</p>
                </div>
            </section>
        </aside>

        <main id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scriptsoud.js"></script>
</body>
</html>
