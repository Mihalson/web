<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vězeňská služba ČR - Mapa a Statistiky</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylevez.css">
</head>
<body>
    <nav class="top-nav">
        <a href="veznice.html" class="active">Přehled věznic</a>
        <a href="../soudy/soudy.html">Přehled soudů</a>
        <a href="../pcr/pcr.html">Mapa Kriminality</a>
        <a href="../oprojektu/o-projektu.html">O projektu</a>
    </nav>

    <div id="map"></div>

    <div class="search-container">
        <input type="text" id="mapSearchInput" placeholder="Hledat věznici nebo adresu (např. Praha)..." autocomplete="off">
        <button title="Hledat">🔎︎</button>
        <div id="mapSearchResults" class="search-results"></div>
    </div>
    
    <div id="legend" class="map-overlay"></div>

    <div id="sidebarLeft" class="sidebar-left-collapsed">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h2>Statistiky Vězňů</h2>
                <div class="filter-area">
                    <select id="datasetFilter">
                        <option value="cizinci">Cizinci</option>
                        <option value="dozivoti">Doživotí</option>
                        <option value="obvineni">Obvinění</option>
                        <option value="odsouzeni">Odsouzení</option>
                        <option value="chovanci">Chovanci</option>
                        <option value="osoby">Osoby</option>
                        <option value="volby">Volby</option>
                    </select>
                    <select id="yearFilterPrisoners">
                        <option value="2024">Rok 2024</option>
                        <option value="2023">Rok 2023</option>
                        <option value="2022">Rok 2022</option>
                        <option value="2021">Rok 2021</option>
                        <option value="2020">Rok 2020</option>
                    </select>
                </div>
            </div>
            
            <div id="prisonersDashboard"></div>

            <div class="comparison-container" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd;">
                <h3>Porovnání vývoje</h3>
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 0.9em; font-weight: bold; display: block; margin-bottom: 5px;">Vyberte roky k porovnání:</label>
                    <div id="yearCheckboxes" style="display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.9em;">
                        <label><input type="checkbox" value="2020"> 2020</label>
                        <label><input type="checkbox" value="2021"> 2021</label>
                        <label><input type="checkbox" value="2022"> 2022</label>
                        <label><input type="checkbox" value="2023" checked> 2023</label>
                        <label><input type="checkbox" value="2024" checked> 2024</label>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
                    <div>
                        <label style="font-size: 0.9em; font-weight: bold;">Kategorie dat:</label>
                        <select id="categorySelect" onchange="updateMetricSelect()" style="width: 100%; padding: 6px; border-radius: 4px;"></select>
                    </div>
                    <div>
                        <label style="font-size: 0.9em; font-weight: bold;">Sledovaná hodnota:</label>
                        <select id="metricSelect" style="width: 100%; padding: 6px; border-radius: 4px;"></select>
                    </div>
                </div>
                <button onclick="compareYears()" style="width: 100%; padding: 8px 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">POROVNAT VYBRANÉ</button>
                <div style="position: relative; height: 250px; margin-top: 15px;">
                    <canvas id="comparisonChart"></canvas>
                </div>
            </div>
        </div>
        <div class="sidebar-handle-left" id="handleLeft">DATA VĚZŇŮ</div>
    </div>

    <div id="sidebar" class="sidebar-collapsed">
        <div id="sidebarHandle" class="sidebar-handle"><span>STATISTIKY SBORU</span></div>
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h2>Statistiky zaměstnanců</h2>
                <div class="filter-area">
                    <label for="yearFilterStaff">Zvolit rok:</label>
                    <select id="yearFilterStaff">
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                    </select>
                </div>
            </div>
            <div id="statsDashboard" class="stats-dashboard"></div>
        </div>
    </div>

    <div id="grafModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalLayout" class="modal-grid">
                
                <div class="prison-info-panel">
                    <div id="prisonInfoContent"></div>
                    <div id="prisonerTablesContainer" style="margin-top: 20px;"></div>
                </div>
                
                <div class="stats-panel">
                    <div class="comparison-header">
                        <div class="select-group">
                            <label>Srovnat s:</label>
                            <select id="selectSrovnani"><option value="">-- vybrat věznici --</option></select>
                        </div>
                        <div class="date-filters">
                            <select id="rok"></select>
                            <select id="mesic"></select>
                        </div>
                    </div>
                    <div id="chartContainer" class="gauge-container-main"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scriptvez.js"></script>
    <script src="scriptvez_zam.js"></script>
    <script src="scriptvez_vezni.js"></script>
</body>
</html>
